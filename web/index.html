<!DOCTYPE html>
<html lang="id" data-tema="terang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>ASI (Absensi Siswa)</title>
<meta name="description" content="Aplikasi absensi siswa PAUD/SD: scan QR &amp; barcode, GPS, foto, kartu siswa, rekap, dan notifikasi orang tua.">
<meta name="theme-color" content="#FFD23F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<script src="js/vendor/jsbarcode.min.js"></script>

<script src="js/page-siswa.js"></script>
<script src="js/page-kartu.js"></script>
<script src="js/page-rekap.js"></script>
<script src="js/page-admin.js"></script>
<script src="js/page-akun.js"></script>
<script>
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { App.mulai(); });
  } else {
    App.mulai();
  }
